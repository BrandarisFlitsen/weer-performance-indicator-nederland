name: Collect Dutch city forecasts

on:
  schedule:
    # Run a few minutes past each hour to reduce queue delays.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      rewrite_history:
        description: Remove legacy data and account email from commit history
        required: false
        type: boolean
        default: false
      reset_legacy_data:
        description: Clear old-format CSVs before collecting the first wide forecast row
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weather-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete data and account email from history
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rewrite_history }}
        run: |
          git checkout -B main origin/main
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f \
            --index-filter 'git rm --cached --ignore-unmatch -r temperatures.csv city_data' \
            --env-filter '
            if [ "$GIT_AUTHOR_NAME" = "BrandarisFlitsen" ]; then
              export GIT_AUTHOR_NAME="Codex"
              export GIT_AUTHOR_EMAIL="codex@users.noreply.github.com"
            fi
            if [ "$GIT_COMMITTER_NAME" = "BrandarisFlitsen" ]; then
              export GIT_COMMITTER_NAME="Codex"
              export GIT_COMMITTER_EMAIL="codex@users.noreply.github.com"
            fi
          ' main
          git push --force-with-lease origin main:main

      - name: Clear old-format data files
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_legacy_data && !inputs.rewrite_history }}
        run: |
          mkdir -p city_data
          rm -f temperatures.csv
          find city_data -maxdepth 1 -type f -name '*.csv' -delete

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect hourly forecast rows
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.rewrite_history }}
        run: python temperature_collector.py --once

      - name: Commit updated city data
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.rewrite_history }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No forecast data changes to commit."
          else
            git commit -m "Record hourly city forecasts"
            git push
          fi

