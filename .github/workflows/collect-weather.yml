name: Collect Dutch city temperatures

on:
  schedule:
    # GitHub schedule uses UTC. Offset away from the top of the hour to reduce queue delays.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the main branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect current temperatures and due forecasts
        run: python temperature_collector.py --once

      - name: Commit updated city data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add city_data/*.csv
          if git diff --cached --quiet; then
            echo "No weather data changes to commit."
          else
            git commit -m "Record weather observations"
            git push
          fi
